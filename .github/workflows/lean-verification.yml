name: Lean 4 Formal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan & Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean .lake folder
        uses: actions/cache@v4
        with:
          path: formal_verification/.lake
          key: ${{ runner.os }}-lean-${{ hashFiles('formal_verification/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-

      - name: Verify Lean toolchain version
        run: |
          cd formal_verification
          elan default v4.34.0-rc2
          lean --version

      - name: Build formal verification plane
        run: |
          cd formal_verification
          lake build
