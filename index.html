<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN LATTICE | Command Center</title>
    <style>
        :root {
            --bg: #050505;
            --grid: #111116;
            --text-main: #e0e0e0;
            --accent-green: #00ff66;
            --accent-blue: #00e5ff;
            --alert-red: #ff3366;
            --font-mono: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        header {
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; color: var(--accent-blue); text-transform: uppercase; }
        .status-badge {
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            padding: 5px 10px;
            border: 1px solid var(--accent-green);
            font-size: 0.8rem;
        }
        
        /* Control Panel */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(10, 10, 12, 0.9);
            padding: 15px;
            border: 1px solid #333;
        }
        button {
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 8px 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        button:hover { background: var(--accent-blue); color: #000; }
        button.danger { color: var(--alert-red); border-color: var(--alert-red); }
        button.danger:hover { background: var(--alert-red); color: #fff; }

        /* Terminal */
        .terminal-container {
            background: #020202;
            border: 1px solid #333;
            border-left: 3px solid var(--accent-green);
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .terminal-output {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: var(--accent-green);
        }
        .terminal-input-line {
            display: flex;
            padding: 10px 15px;
            background: #0a0a0c;
            border-top: 1px dashed #333;
        }
        .prompt { color: var(--accent-blue); margin-right: 10px; }
        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>⬡ SOVEREIGN LATTICE</h1>
            <small style="color: #666;">COMMAND & CONTROL CENTER</small>
        </div>
        <div class="status-badge" id="status-indicator">DAEMON ONLINE</div>
    </header>

    <!-- Interactive Control Panel -->
    <div class="controls">
        <button onclick="injectPacket()">Inject Payload</button>
        <button onclick="toggleTelemetry()">Toggle Auto-Logs</button>
        <button class="danger" onclick="triggerViewChange()">Force View Change</button>
        <button onclick="clearTerminal()" style="margin-left: auto;">Clear Console</button>
    </div>

    <!-- Interactive Terminal -->
    <div class="terminal-container">
        <div class="terminal-output" id="output">
            <div>> SOVEREIGN LATTICE Web Console Initialized.</div>
            <div>> Type 'help' for available commands.</div>
        </div>
        <div class="terminal-input-line">
            <span class="prompt">root@lattice:~#</span>
            <input type="text" id="cli" autocomplete="off" autofocus onkeypress="handleCLI(event)">
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const cli = document.getElementById('cli');
        let autoLogInterval = null;
        let seqCounter = 2000;

        function log(message, color = "var(--accent-green)") {
            const time = new Date().toISOString().split('T')[1].slice(0,-1);
            const div = document.createElement('div');
            div.innerHTML = `> <span style="color: #555;">[${time}]</span> <span style="color: ${color};">${message}</span>`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearTerminal() {
            output.innerHTML = '';
            log("Console cleared.");
        }

        // Button Actions
        function injectPacket() {
            seqCounter++;
            log(`Constructing zero-trust payload for sequence ${seqCounter}...`, "var(--accent-blue)");
            setTimeout(() => log(`[API BRIDGE] Payload ${seqCounter} injected successfully.`), 600);
        }

        function triggerViewChange() {
            log("WARNING: View change requested. Broadcasting to quorum...", "var(--alert-red)");
            setTimeout(() => log("View Change Certificate (VCC) compiled. Leader rotated.", "var(--accent-blue)"), 1200);
        }

        function toggleTelemetry() {
            if (autoLogInterval) {
                clearInterval(autoLogInterval);
                autoLogInterval = null;
                log("Auto-telemetry paused.", "#888");
                document.getElementById('status-indicator').innerText = "STANDBY";
            } else {
                log("Auto-telemetry resumed.");
                document.getElementById('status-indicator').innerText = "DAEMON ONLINE";
                autoLogInterval = setInterval(() => {
                    log(`PBFT Engine: Node sync check... OK. (Lat: ${Math.floor(Math.random() * 12 + 2)}ms)`);
                }, 4000);
            }
        }

        // CLI Handler
        function handleCLI(event) {
            if (event.key === 'Enter') {
                const cmd = cli.value.trim().toLowerCase();
                cli.value = '';
                if (!cmd) return;
                
                log(`root@lattice:~# ${cmd}`, "var(--text-main)");
                
                switch(cmd) {
                    case 'help':
                        log("Commands: help, clear, inject, status, verify");
                        break;
                    case 'clear':
                        clearTerminal();
                        break;
                    case 'inject':
                        injectPacket();
                        break;
                    case 'status':
                        log("System Status: ALL MODULES SECURE. δ = 1.0.");
                        break;
                    case 'verify':
                        log("Executing formal proof verification...", "var(--accent-blue)");
                        setTimeout(() => log("GodelLobBFT.lean -> SOUNDNESS CONFIRMED."), 1000);
                        break;
                    default:
                        log(`Command not found: ${cmd}. Type 'help'.`, "var(--alert-red)");
                }
            }
        }
    </script>
</body>
</html>
